[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hashtag-robotics-tic-tac-toe"
dynamic = ["version"]
description = "End-to-end SO-101 tic-tac-toe hardware, policy, and Strands agent runtime"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hashtag Robotics" }]
dependencies = [
  "huggingface-hub>=1.0,<2",
  "packaging>=24.2",
]

[project.optional-dependencies]
agents = [
  "strands-agents>=1.48,<2",
  "ollama>=0.6,<1",
]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
so101 = [
  "lerobot[core_scripts,feetech,smolvla]>=0.6.1,<0.7",
]
strands-robots = [
  "strands-robots[lerobot,sim-mujoco]==0.5.1",
  "lerobot[core_scripts,feetech,smolvla]>=0.6.1,<0.7",
]
training = [
  "lerobot[training]>=0.6.1,<0.7",
]

[project.urls]
Repository = "https://github.com/Hashtag-Robotics/so101-tic-tac-toe"
Dashboard = "https://github.com/Hashtag-Robotics/so101-dashboard"
Dataset = "https://huggingface.co/datasets/HashtagRobotics/tic-tac-toe-so101-block-a-clean-v1"

[project.scripts]
hashtag-ttt-lerobot-record = "hashtag_robotics_ttt.lerobot_wrappers:record_main"
hashtag-ttt-lerobot-rollout = "hashtag_robotics_ttt.lerobot_wrappers:rollout_main"

[tool.hatch.version]
path = "src/hashtag_robotics_ttt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hashtag_robotics_ttt"]

[tool.hatch.build]
include = [
  "src/hashtag_robotics_ttt/**/*.py",
  "src/hashtag_robotics_ttt/**/*.json",
  "src/hashtag_robotics_ttt/**/*.swift",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/hashtag_robotics_ttt",
  "LICENSE",
  "NOTICE",
  "README.md",
  "STRANDS_AGENT.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

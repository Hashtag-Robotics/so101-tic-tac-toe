<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 240" role="img" aria-labelledby="title desc">
  <title id="title">SmolVLA checkpoint lineage</title>
  <desc id="desc">Six checkpoints from 20 thousand through 120 thousand training steps, with the revision-pinned 120 thousand checkpoint selected as the default release artifact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0f16"/><stop offset="1" stop-color="#161a25"/></linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#555e70"/><stop offset="0.75" stop-color="#ff754e"/><stop offset="1" stop-color="#ff304f"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="240" rx="28" fill="url(#bg)"/>
  <text x="58" y="53" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Training left us a ladder, not a magic number</text>
  <text x="58" y="79" fill="#80899a" font-family="Inter,Arial,sans-serif" font-size="13" letter-spacing="1.3">COMPARE EVERY CHECKPOINT; THE PUBLIC DEFAULT IS PINNED TO 120K</text>
  <path d="M120 142H1320" stroke="#303747" stroke-width="8" stroke-linecap="round"/>
  <path d="M120 142H1320" stroke="url(#track)" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(120 142)"><circle r="13" fill="#171c27" stroke="#7a8497" stroke-width="4"/><text y="43" fill="#e7eaf0" font-size="15" font-weight="700">20K</text></g>
    <g transform="translate(360 142)"><circle r="13" fill="#171c27" stroke="#7a8497" stroke-width="4"/><text y="43" fill="#e7eaf0" font-size="15" font-weight="700">40K</text></g>
    <g transform="translate(600 142)"><circle r="13" fill="#171c27" stroke="#8b8790" stroke-width="4"/><text y="43" fill="#e7eaf0" font-size="15" font-weight="700">60K</text></g>
    <g transform="translate(840 142)"><circle r="13" fill="#171c27" stroke="#bb795f" stroke-width="4"/><text y="43" fill="#e7eaf0" font-size="15" font-weight="700">80K</text></g>
    <g transform="translate(1080 142)"><circle r="13" fill="#171c27" stroke="#ea554f" stroke-width="4"/><text y="43" fill="#e7eaf0" font-size="15" font-weight="700">100K</text></g>
    <g transform="translate(1320 142)" filter="url(#glow)"><circle r="19" fill="#ff304f" stroke="#ff91a2" stroke-width="4"/><circle r="5" fill="#ffffff"/><text y="48" fill="#ffffff" font-size="17" font-weight="800">120K</text><text y="69" fill="#ff91a2" font-size="10" font-weight="800" letter-spacing="1">DEFAULT</text></g>
  </g>
</svg>

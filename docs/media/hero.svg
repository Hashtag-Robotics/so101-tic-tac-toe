<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Hashtag Robotics SO-101 Tic-Tac-Toe</title>
  <desc id="desc">A dark technical illustration of an SO-101 robot arm playing tic-tac-toe, with the words A robot arm that learned to play.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a0f"/>
      <stop offset="0.52" stop-color="#111522"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="72%" cy="54%" r="52%">
      <stop offset="0" stop-color="#ff304f" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#ff304f" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ff304f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfc5d4"/>
    </linearGradient>
    <linearGradient id="so101Plastic" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#dfe4eb"/>
      <stop offset="1" stop-color="#8791a1"/>
    </linearGradient>
    <linearGradient id="so101Servo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#313844"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1440" height="560" rx="32" fill="url(#bg)"/>
  <rect width="1440" height="560" rx="32" fill="url(#grid)"/>
  <rect width="1440" height="560" rx="32" fill="url(#redGlow)"/>
  <path d="M0 482C272 420 430 520 682 472S1120 387 1440 453V560H0Z" fill="#050609" fill-opacity="0.72"/>

  <g transform="translate(76 66)">
    <g aria-label="Hashtag Robotics">
      <rect width="278" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <path d="M20 11v12M31 11v12M15 15h21M15 20h21" stroke="#ff304f" stroke-width="2.4" stroke-linecap="round"/>
      <text x="48" y="23" fill="#f7f8fb" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2.1">HASHTAG ROBOTICS</text>
    </g>
    <text x="0" y="87" fill="#ff4662" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3.3">OPEN PHYSICAL AI / PROJECT 01</text>
    <text x="0" y="153" fill="url(#headline)" font-family="Inter,Arial,sans-serif" font-size="61" font-weight="800" letter-spacing="-2.4">
      <tspan x="0" dy="0">A ROBOT ARM</tspan>
      <tspan x="0" dy="68">THAT LEARNED</tspan>
      <tspan x="0" dy="68">TO PLAY.</tspan>
    </text>
    <text x="2" y="387" fill="#929bad" font-family="Inter,Arial,sans-serif" font-size="18" letter-spacing="0.4">SO-101  ×  TIC-TAC-TOE  ×  SMOLVLA</text>
    <g transform="translate(0 421)">
      <circle cx="6" cy="6" r="6" fill="#2dd4bf"/>
      <text x="22" y="12" fill="#c9cfda" font-family="Inter,Arial,sans-serif" font-size="15">CAD → print → data → train → agent → play</text>
    </g>
  </g>

  <g transform="translate(735 74)" filter="url(#softShadow)">
    <!-- board -->
    <g transform="translate(154 224) skewX(-9) rotate(-4 190 115)">
      <rect x="0" y="0" width="408" height="242" rx="24" fill="#0d1119" stroke="#ffffff" stroke-opacity="0.12"/>
      <path d="M136 25V217M272 25V217M26 81H382M26 161H382" stroke="#434b5c" stroke-width="12" stroke-linecap="round"/>
      <g fill="none" stroke="#e9edf4" stroke-width="13">
        <circle cx="68" cy="41" r="24"/>
        <circle cx="205" cy="121" r="24"/>
        <circle cx="340" cy="201" r="24"/>
      </g>
      <g stroke="#ff304f" stroke-width="15" stroke-linecap="round" filter="url(#glow)">
        <path d="M181 25l48 38M229 25l-48 38"/>
        <path d="M44 103l48 38M92 103l-48 38"/>
        <path d="M316 103l48 38M364 103l-48 38"/>
      </g>
    </g>

    <!-- SO-101: open links, exposed STS3215-class servos and parallel gripper -->
    <g transform="translate(0 0)" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="158" cy="438" rx="120" ry="24" fill="#000000" fill-opacity="0.48"/>

      <!-- perforated printed base -->
      <path d="M67 414h126l31 36H48Z" fill="#353d4b" stroke="#778193" stroke-width="2"/>
      <path d="M79 404h109l18 18H62Z" fill="url(#so101Plastic)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
      <g fill="#3d4655" opacity="0.9">
        <circle cx="91" cy="411" r="3"/><circle cx="108" cy="411" r="3"/><circle cx="125" cy="411" r="3"/>
        <circle cx="142" cy="411" r="3"/><circle cx="159" cy="411" r="3"/><circle cx="176" cy="411" r="3"/>
        <circle cx="102" cy="417" r="3"/><circle cx="119" cy="417" r="3"/><circle cx="136" cy="417" r="3"/>
        <circle cx="153" cy="417" r="3"/><circle cx="170" cy="417" r="3"/>
      </g>

      <!-- base rotation and shoulder servo cage -->
      <ellipse cx="137" cy="393" rx="42" ry="14" fill="#141922" stroke="#8f98a8" stroke-width="3"/>
      <rect x="103" y="341" width="69" height="57" rx="8" fill="url(#so101Servo)" stroke="#687283" stroke-width="3"/>
      <rect x="113" y="350" width="48" height="40" rx="5" fill="#11151d"/>
      <path d="M91 331h24v69H91q-10 0-10-10v-49q0-10 10-10Zm81 0h24q10 0 10 10v49q0 10-10 10h-24Z" fill="url(#so101Plastic)" stroke="#f8fafc" stroke-opacity="0.45" stroke-width="2"/>
      <path d="M88 339h17v53H88M179 339h18v53h-18" fill="none" stroke="#707a8a" stroke-width="4"/>
      <circle cx="144" cy="336" r="24" fill="#252b35" stroke="#e7ebf0" stroke-width="8"/>
      <circle cx="144" cy="336" r="7" fill="#ff304f" filter="url(#glow)"/>
      <circle cx="144" cy="318" r="2.7" fill="#70798a"/><circle cx="126" cy="336" r="2.7" fill="#70798a"/><circle cx="162" cy="336" r="2.7" fill="#70798a"/>

      <!-- tall printed shoulder link with the characteristic open center -->
      <path d="M133 322 190 171q5-14 19-17l29-5q13-2 20 9l10 15-67 166q-5 13-18 17l-28 6q-13 2-18-10Z" fill="url(#so101Plastic)" stroke="#f7f9fc" stroke-opacity="0.55" stroke-width="2.5"/>
      <path d="m159 312 46-123q4-10 13-12l17-3 8 11-54 135q-3 7-10 9l-15 3Z" fill="#222833" stroke="#70798a" stroke-width="3"/>
      <path d="m166 302 39-105q4-10 12-12l10-2-48 126Z" fill="#0c1017" fill-opacity="0.72"/>
      <path d="M143 315 194 177M188 341l65-166" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
      <circle cx="154" cy="301" r="3.5" fill="#505968"/><circle cx="180" cy="328" r="3.5" fill="#505968"/>
      <circle cx="202" cy="190" r="3.5" fill="#505968"/><circle cx="247" cy="177" r="3.5" fill="#505968"/>

      <!-- elbow servo and long open forearm channel -->
      <g transform="rotate(-17 237 170)">
        <rect x="201" y="139" width="73" height="62" rx="9" fill="url(#so101Servo)" stroke="#7d8797" stroke-width="3"/>
        <path d="M193 132h22v76h-22q-8 0-8-8v-60q0-8 8-8Zm81 0h20q8 0 8 8v60q0 8-8 8h-20Z" fill="url(#so101Plastic)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
        <circle cx="237" cy="170" r="17" fill="#242a34" stroke="#dfe4eb" stroke-width="6"/>
        <circle cx="237" cy="170" r="5" fill="#ff304f"/>
      </g>
      <path d="m245 139 127-50q13-5 24 4l15 13q9 8 4 20l-9 19-143 55q-10 4-19-3l-16-13q-8-7-4-17Z" fill="url(#so101Plastic)" stroke="#ffffff" stroke-opacity="0.58" stroke-width="2.5"/>
      <path d="m263 151 112-43q8-3 14 2l7 6-132 51-13-7Z" fill="#202631" stroke="#768091" stroke-width="3"/>
      <path d="m270 157 101-39" fill="none" stroke="#080b10" stroke-opacity="0.8" stroke-width="7"/>
      <path d="m249 143 125-48" fill="none" stroke="#ffffff" stroke-opacity="0.52" stroke-width="4"/>
      <g fill="#596273">
        <circle cx="278" cy="138" r="3.2"/><circle cx="307" cy="127" r="3.2"/><circle cx="337" cy="115" r="3.2"/><circle cx="369" cy="103" r="3.2"/>
        <circle cx="278" cy="181" r="3.2"/><circle cx="311" cy="168" r="3.2"/><circle cx="344" cy="155" r="3.2"/><circle cx="378" cy="142" r="3.2"/>
      </g>
      <g transform="translate(305 137) rotate(-21)">
        <rect x="0" y="0" width="48" height="17" rx="5" fill="#eef1f5" stroke="#697384" stroke-width="2"/>
        <path d="M10 5h7v7h-7m11-7h7v7h-7m11-7h7v7h-7" fill="#4c5564"/>
      </g>

      <!-- wrist-roll housing -->
      <g transform="translate(385 91) rotate(24)">
        <path d="M0 7q0-7 8-7h55q9 0 12 8l7 21-13 31H8q-8 0-8-8Z" fill="url(#so101Plastic)" stroke="#ffffff" stroke-opacity="0.58" stroke-width="2.5"/>
        <rect x="16" y="8" width="42" height="39" rx="6" fill="url(#so101Servo)" stroke="#687283" stroke-width="3"/>
        <circle cx="70" cy="31" r="18" fill="#252b35" stroke="#e3e7ed" stroke-width="6"/>
        <circle cx="70" cy="31" r="5" fill="#ff304f"/>
        <path d="M7 12h7M7 22h7M7 32h7M7 42h7" stroke="#70798a" stroke-width="3"/>
      </g>

      <!-- SO-101 parallel gripper, opened over the board -->
      <g transform="translate(433 129) rotate(24)">
        <path d="M0 0h58q9 0 9 9v48q0 9-9 9H0Z" fill="url(#so101Plastic)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5"/>
        <rect x="8" y="8" width="39" height="49" rx="6" fill="url(#so101Servo)" stroke="#687283" stroke-width="3"/>
        <path d="M50 9h17v19H50M50 39h17v19H50" fill="#dbe0e7" stroke="#697384" stroke-width="2"/>
        <path d="M64 7 117 1l18 8-7 13-61 10Z" fill="url(#so101Plastic)" stroke="#e8ecf1" stroke-width="2.5"/>
        <path d="m66 42 58 11 13 13-10 11-63-17Z" fill="url(#so101Plastic)" stroke="#e8ecf1" stroke-width="2.5"/>
        <path d="m116 3 20 5-8 14-18 3m14 28 14 12-11 13-18-6" fill="#626c7c"/>
        <circle cx="76" cy="18" r="3.5" fill="#4d5665"/><circle cx="76" cy="51" r="3.5" fill="#4d5665"/>
        <circle cx="51" cy="33" r="4.5" fill="#ff304f"/>
      </g>

      <text x="202" y="245" transform="rotate(-69 202 245)" fill="#d9dee6" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="800" letter-spacing="1.2">SO-101</text>
    </g>
  </g>

  <g transform="translate(1180 55)">
    <text x="0" y="0" fill="#697386" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">END-TO-END</text>
    <text x="0" y="23" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="13">Hardware + data</text>
    <text x="0" y="43" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="13">Policy + agent</text>
  </g>
</svg>

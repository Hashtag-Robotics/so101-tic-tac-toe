name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    name: Game contract, tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the software-only runtime
        run: uv sync --extra dev --extra agents

      - name: Verify the release
        run: bash scripts/verify.sh

      - name: Build the distributable package
        run: uv build

      - name: Install the wheel into a clean environment
        run: |
          uv venv .clean
          uv pip install --python .clean/bin/python dist/*.whl
          .clean/bin/python -c "import hashtag_robotics_ttt; print(hashtag_robotics_ttt.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: tic-tac-toe-wheel
          path: dist/*.whl

  strands-robots-contract:
    name: Strands Robots and LeRobot 0.6.1 contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the native optional runtime
        run: uv sync --extra dev --extra agents --extra strands-robots

      - name: Run the complete game test suite
        run: uv run pytest -q

      - name: Inspect without constructing a robot
        run: uv run python scripts/inspect_ttt_strands_robots.py
